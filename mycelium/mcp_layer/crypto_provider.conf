# ═══════════════════════════════════════════════════════════════════
# Quantum Flex — Cryptographic Provider Configuration
# This file is MUTABLE. The immune_daemon.py rewrites it via sed
# when OPA flags the active algorithm as TOXIC.
# ═══════════════════════════════════════════════════════════════════

[provider]
# Active KEM algorithm for tunnel establishment
active_kem = ML-KEM-768

# Active signature algorithm for envelope signing
active_sig = ML-DSA-65

# Fallback chain (ordered by priority)
fallback_kem_1 = FrodoKEM-976-AES
fallback_kem_2 = X25519

fallback_sig_1 = SLH-DSA-SHA2-128f
fallback_sig_2 = Ed25519

# Key sizes (bytes) — used by shard membrane for buffer allocation
[key_sizes]
ML-KEM-768 = 1184
ML-KEM-1024 = 1568
FrodoKEM-976-AES = 15632
X25519 = 32
